<mat-form-field [appearance]="appearance">
  <mat-label>
    <ng-content select="mat-icon"></ng-content>
    <span>{{ label }}</span>
  </mat-label>
  <input
    matInput
    [name]="label"
    [type]="type"
    [value]="value"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />
  <ng-content select="mat-error"></ng-content>
</mat-form-field>
