<section class="container">
  <section id="plate-search">
    <section class="active-vehicles">
      <app-truck-icon />
      <h2>Ενεργά Οχήματα</h2>
    </section>

    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill">
        <mat-label class="">
          <mat-icon
            aria-hidden="false"
            aria-label="search icon"
            fontIcon="search"
          ></mat-icon>
          <span>Αριθμός Πινακίδας</span>
        </mat-label>
        <input
          matInput
          id="plate"
          name="plate"
          type="text"
          [(ngModel)]="enteredPlate"
        />
      </mat-form-field>
      <section class="btn-bar">
        <a
          mat-raised-button
          type="button"
          [routerLink]="['/records']"
          (click)="onCancel()"
          >Ακύρωση</a
        >
        <button
          mat-raised-button
          type="submit"
          [routerLink]="['/records', enteredPlate]"
        >
          Αναζήτηση
        </button>
      </section>
    </form>
  </section>

  <mat-divider></mat-divider>

  @if(isLoading$ | async){
  <app-progress-spinner diameter="50" />
  }

  <mat-nav-list>
    @for(vehicle of vehicles; track vehicle.id){
    <mat-list-item>
      <app-vehicle [plate]="vehicle.plate" />
    </mat-list-item>
    }
  </mat-nav-list>
</section>
